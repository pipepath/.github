# Reusable workflow (pipepath/.github, a public repository). Runs this repository's verifier copy against the
# caller, and runs gitleaks over the caller's full history with the central config (layer 3 of the secret
# defences). The caller's own gitleaks configuration is never read: the scan config is `gitleaks/base.toml` plus
# the optional `gitleaks/allow/<repo>.toml` of this repository, so a per-repo exception is a reviewed PR here.
# Everything that runs comes from the checkout of this repository at the called workflow's commit; nothing
# from the caller is interpolated into a `run:` line, and Python runs isolated (`-I`) so a caller file cannot
# shadow a module.
name: repo-standards
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ fromJSON(((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && vars.PIPEPATH_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # Prerequisite: the caller's GITHUB_TOKEN is scoped to the caller repository, so pipepath/.github
      # must be readable by it. It is a public repository (it holds no secrets), so no token is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pipepath/.github
          ref: ${{ job.workflow_sha }}
          path: central
          persist-credentials: false
      # Public repositories must never reach the self-hosted runners. The canonical runs-on falls back to hosted
      # only while PIPEPATH_RUNNER is unset (infra guarantees that for public repositories); the verifier pins
      # it by failing every job whose runs-on is not exactly the canonical expression, unless `--repo-private`
      # is exactly "true". The visibility and the repository name come from the event context through `env:`
      # (never interpolated into the script); the visibility fails closed (anything but "true" is public). The
      # name is derived and validated exactly as in the gitleaks job: another owner or an odd name passes no
      # `--repo-name`, and the verifier then warns that it cannot confirm the central exception file. The `=` form
      # keeps a value that starts with `-` from being read as an option. The gitleaks job's `-f` follows symlinks
      # inside the trusted central checkout while the verifier's check does not (the safe direction).
      - name: verify
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          name="${CALLER#pipepath/}"
          args=(--version "$(cat central/repo-standards/VERSION)" --repo-private="$REPO_PRIVATE" --central-gitleaks central/gitleaks)
          if [[ "$CALLER" == pipepath/* && "$name" =~ ^[A-Za-z0-9_.-]+$ && "$name" != . && "$name" != .. ]]; then
            args+=(--repo-name="$name")
          fi
          python3 -I central/repo-standards/verify.py repo "${args[@]}"
  gitleaks:
    runs-on: ${{ fromJSON(((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && vars.PIPEPATH_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pipepath/.github
          ref: ${{ job.workflow_sha }}
          path: central
          persist-credentials: false
      # The only caller-derived value is the repository name, passed through `env:` (never interpolated into the
      # script) and validated before it names a file. Any other owner, an odd name, `.` or `..` gets the base config
      # alone. The config is composed here from the central checkout, so neither the caller's `.gitleaks.toml`
      # nor `GITLEAKS_CONFIG*` is ever read (an explicit --config wins over those variables anyway).
      - name: gitleaks
        env:
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          name="${CALLER#pipepath/}"
          parts=(central/gitleaks/base.toml)
          if [[ "$CALLER" == pipepath/* && "$name" =~ ^[A-Za-z0-9_.-]+$ && "$name" != . && "$name" != .. \
                && -f "central/gitleaks/allow/$name.toml" ]]; then
            parts+=("central/gitleaks/allow/$name.toml")
          fi
          # A newline between the parts keeps a missing trailing newline from joining two lines.
          : > "$RUNNER_TEMP/gitleaks.toml"
          for part in "${parts[@]}"; do { cat "$part"; printf '\n'; } >> "$RUNNER_TEMP/gitleaks.toml"; done
          # gitleaks auto-loads <source>/.gitleaksignore even when --gitleaks-ignore-path points elsewhere, so
          # the working-tree copy is removed (the scan reads git history) and the flag gets an empty file.
          rm -rf repo/.gitleaksignore
          # A `* -diff` or `binary` .gitattributes in the caller makes `git log -p` omit patches, so the
          # highest-precedence attributes file of the checkout forces diffs on. Trade-off: `* diff` also makes
          # `git log -p` print binary files in full, so the scan takes more scan time and may report extra
          # findings; it errs on the side of reporting (fail closed).
          mkdir -p repo/.git/info
          printf '* diff\n' > repo/.git/info/attributes
          # Inline `gitleaks:allow` comments are ignored (--ignore-gitleaks-allow): a false positive needs an
          # allow file here. The container runs under a clean environment (only PATH and HOME for the docker
          # client; DOCKER_HOST and DOCKER_CONFIG are not caller-controlled) and receives none (no -e, no
          # --env-file). The source is the explicit `git /repo`, the history is every ref the checkout fetched
          # (--full-history --all, what gitleaks uses by default, stated here), and the workflow has no inputs:
          # the caller checkout is the event's commit and the central checkout is pinned to the called
          # workflow's commit. On a containerized runner that talks to a host Docker daemon, the mounts below
          # may not exist on the daemon host: the scan then fails closed (gitleaks cannot read --config or the
          # repository) instead of running with another config.
          env -i PATH="$PATH" HOME="$HOME" docker run --rm \
            -v "$PWD/repo:/repo" \
            -v "$RUNNER_TEMP/gitleaks.toml:/central/gitleaks.toml:ro" \
            -v "$PWD/central/gitleaks/empty.gitleaksignore:/central/empty.gitleaksignore:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /central/gitleaks.toml --gitleaks-ignore-path /central/empty.gitleaksignore \
            --ignore-gitleaks-allow --log-opts="--full-history --all" --redact --verbose
