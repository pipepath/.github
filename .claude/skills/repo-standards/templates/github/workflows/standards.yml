# Pipepath repo standard (org rule 14): runs the central verifier at a pinned SHA.
name: standards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standards:
    uses: pipepath/.github/.github/workflows/repo-standards.yml@0000000000000000000000000000000000000000 # set by /sync-repos
